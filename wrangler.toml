# Cloudflare Pages · app-turnos
#
# Local:  npm run build && npx wrangler pages dev dist
#         (los secretos los lee de .dev.vars, que NO se sube a git)
#
# En producción las variables se cargan en el panel de Pages
# (Settings -> Variables and Secrets). Ver README.
name = "app-turnos"
pages_build_output_dir = "dist"
compatibility_date = "2025-10-01"

[vars]
APP_ORIGIN = "https://turnos.futurislabs.net"
MAIL_FROM = "Futurislabs <hola@futurislabs.net>"

# Rate limit de las rutas públicas (KV "TURNOS_RATE").
# Sin este binding, las Functions caen a un contador en memoria por isolate.
[[kv_namespaces]]
binding = "RATE"
id = "484a25a2b4804a9ba6cb2d4066f9d770"
